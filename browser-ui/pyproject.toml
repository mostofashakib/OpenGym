[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opengym-browser-ui"
version = "1.0.0"
description = "Browser procurement environment UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["browser_sim", "agent", "verifiers"]

[tool.setuptools.package-dir]
browser_sim = "environment/browser_sim"
