services:
  main:
    build:
      context: ..
      dockerfile: environment/Dockerfile
      target: agent
    volumes:
      - browser-ipc:/run/browser
    depends_on:
      browser:
        condition: service_healthy

  browser:
    build:
      context: ..
      dockerfile: environment/Dockerfile
      target: world
    volumes:
      - browser-ipc:/run/browser
    healthcheck:
      test: ["CMD", "python3", "-m", "browser_sim.admin_cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

volumes:
  browser-ipc:
