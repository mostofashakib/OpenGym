[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software"
version = "0.1.0"
description = "Generative Multi-Domain Software Environment for OpenGym"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "harbor>=0.22.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["software_sim*", "tools*", "verifiers*", "solution*"]

[tool.setuptools.package-dir]
software_sim = "environment/software_sim"
