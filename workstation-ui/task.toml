schema_version = "1.4"

[task]
name = "opengym/workstation-ui"
version = "1.0.0"
description = "Simulated enterprise employee workstation operating system and web UI for cross-application computer-use agents."
authors = [{ name = "Mostofa Shakib" }]
keywords = ["workstation", "desktop-os", "crm", "tickets", "billing", "email", "spreadsheets", "mcp", "harbor"]

[metadata]
difficulty = "hard"
category = "workstation-ui"
environment_service = "workstation-ui"
database = "sqlite"

[verifier]
timeout_sec = 180.0
environment_mode = "shared"
user = "root"

[[verifier.collect]]
command = "python3 -m workstation_sim.admin_cli export_state --out /var/lib/workstation/state-export.json"
service = "workstation"
timeout_sec = 30.0

[agent]
timeout_sec = 1200.0
user = "agent"

[environment]
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 8192

[ports]
web_ui = 3008
