[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workstation-ui"
version = "1.0.0"
description = "OmniDesk Employee Workstation OS UI environment and Harbor evaluation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "mcp>=1.0.0",
]

[tool.setuptools]
packages = ["workstation_sim", "tools", "verifiers", "solution"]

[tool.setuptools.package-dir]
workstation_sim = "environment/workstation_sim"

[tool.pytest.ini_options]
pythonpath = ["environment", ".", "tests"]
testpaths = ["tests"]
