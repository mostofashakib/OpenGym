[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ui"
version = "1.0.0"
description = "Apex Enterprise Cloud Unified Operations Console UI environment and Harbor evaluation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "mcp>=1.0.0",
]

[tool.setuptools]
packages = ["enterprise_sim", "tools", "verifiers", "solution"]

[tool.setuptools.package-dir]
enterprise_sim = "environment/enterprise_sim"

[tool.pytest.ini_options]
pythonpath = ["environment", ".", "tests"]
testpaths = ["tests"]
