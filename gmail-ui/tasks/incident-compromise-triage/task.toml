schema_version = "1.4"
artifacts = [
  { source = "/logs/agent", exclude = ["sessions"] },
  { source = "/var/lib/gmail/state-export.json", service = "gmail" },
]

[task]
name = "opengym/gmail-incident-compromise-triage"
version = "1.0.0"
description = "Triage upstream vendor security disclosure and inbound spear-phishing attack: prioritize vendor API credential leak disclosure, quarantine deceptive phishing emails, maintain legal hold integrity, and draft formal disclosure and executive briefing responses."
authors = [{ name = "Mostofa Shakib" }]
keywords = ["gmail", "email-triage", "harbor", "agent-environment", "mcp", "incident-response", "security", "vendor-compromise", "soc2"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Requires discovering unread incident disclosures, investigating deceptive phishing attempts, enforcing compliance preservation holds, drafting multi-stakeholder legal and executive reports, and maintaining strict mailbox operational hygiene."
category = "agent-environment"
environment_service = "gmail"
originality = "Built as a deterministic OpenGym email agent evaluation environment with high-complexity horizontal incident response workflows."

[verifier]
timeout_sec = 240.0
environment_mode = "shared"
user = "root"

[[verifier.collect]]
command = "python3 -m gmail_sim.admin_cli export_state --out /var/lib/gmail/state-export.json"
service = "gmail"
timeout_sec = 60.0
user = "gmaild"

[agent]
timeout_sec = 1200.0
user = "agent"
network_mode = "allowlist"
allowed_hosts = ["openrouter.ai"]

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 2048
storage_mb = 4096

[[environment.mcp_servers]]
name = "gmail"
transport = "stdio"
command = "/usr/local/bin/gmail-mcp"
