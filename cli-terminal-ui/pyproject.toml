[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opengym-terminal-ui"
version = "1.0.0"
description = "Headless CLI terminal environment UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["terminal_sim", "agent", "verifiers"]

[tool.setuptools.package-dir]
terminal_sim = "environment/terminal_sim"

